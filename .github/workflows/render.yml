name: Render TEROR FM EP03

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Download voiceover + SFX MP3s from Drive
        run: |
          pip install --quiet gdown
          gdown --folder "https://drive.google.com/drive/folders/1PDdvdWDKV-hz5NtsG47_RfFVCKH2lvjy" -O /tmp/ep03
          mkdir -p public/voiceover public/sfx
          find /tmp/ep03 -name 'ep03_*.mp3' -exec cp {} public/voiceover/ \;
          find /tmp/ep03 -name 'sfx*.mp3' -exec cp {} public/sfx/ \;
          echo "Voiceover count: $(ls public/voiceover | wc -l)"
          echo "SFX count: $(ls public/sfx | wc -l)"
          test "$(ls public/voiceover | wc -l)" = "44"
          test "$(ls public/sfx | wc -l)" = "8"

      - run: npx remotion render src/index.ts TerorFM out/teror-fm-ep03.mp4 --concurrency=2 --disallow-parallel-encoding

      - uses: actions/upload-artifact@v4
        with:
          name: teror-fm-ep03
          path: out/teror-fm-ep03.mp4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ep03-v1 out/teror-fm-ep03.mp4 --title "TEROR FM EP03 — Kamar 7" --notes "Render otomatis dari GitHub Actions." || gh release upload ep03-v1 out/teror-fm-ep03.mp4 --clobber
