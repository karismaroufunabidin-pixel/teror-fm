name: Render TEROR FM EP02

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Download voiceover MP3s from Drive
        run: |
          pip install --quiet gdown
          gdown --folder "https://drive.google.com/drive/folders/1TWuY59HnFI7UOR09rpSMOogH94aF2QjK" -O /tmp/voiceover
          mkdir -p public/voiceover
          find /tmp/voiceover -name '*.mp3' -exec cp {} public/voiceover/ \;
          echo "MP3 count: $(ls public/voiceover | wc -l)"
          test "$(ls public/voiceover | wc -l)" = "42"

      - run: npx remotion render src/index.ts TerorFM out/teror-fm-ep02.mp4 --concurrency=2 --disallow-parallel-encoding

      - uses: actions/upload-artifact@v4
        with:
          name: teror-fm-ep02
          path: out/teror-fm-ep02.mp4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ep02-v1 out/teror-fm-ep02.mp4 --title "TEROR FM EP02 — Halte Terakhir" --notes "Render otomatis dari GitHub Actions." || gh release upload ep02-v1 out/teror-fm-ep02.mp4 --clobber
