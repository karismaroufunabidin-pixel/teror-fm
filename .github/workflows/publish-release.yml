name: Publish TEROR FM EP01 release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download render artifact
        uses: actions/download-artifact@v4
        with:
          name: teror-fm-ep01
          path: out
          run-id: 44578247207

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out/
          gh release create ep01-v1 out/teror-fm-ep01.mp4 --title "TEROR FM EP01 — Kuburan Kosong" --notes "Render otomatis dari GitHub Actions."
