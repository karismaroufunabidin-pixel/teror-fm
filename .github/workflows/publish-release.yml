name: Publish TEROR FM EP01 release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44578247207 --name teror-fm-ep01 --dir out
          ls -la out/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MP4=$(find out -name 'teror-fm-ep01.mp4' | head -n 1)
          echo "MP4: $MP4"
          ls -la out/
          gh release create ep01-v1 "$MP4" --title "TEROR FM EP01 — Kuburan Kosong" --notes "Render otomatis dari GitHub Actions."
